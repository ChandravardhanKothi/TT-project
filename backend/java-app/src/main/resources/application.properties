server.port=${PORT:5001}
spring.application.name=marketai-suite

# SQLite (file created in working directory when you run the app)
spring.datasource.url=jdbc:sqlite:marketai.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Behind a proxy (Render), honor X-Forwarded-* headers
server.forward-headers-strategy=framework

# Session cookie controls (important when frontend+backend are on different domains)
# For Render split-deploy: set SESSION_COOKIE_SAMESITE=None and SESSION_COOKIE_SECURE=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAMESITE:Lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# Groq
groq.api-key=${GROQ_API_KEY:}
