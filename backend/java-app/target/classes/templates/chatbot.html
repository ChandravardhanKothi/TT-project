<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketing Chatbot - MarketAI Suite</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <style>
        .chat-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 200px);
            max-height: 800px;
            background: var(--bg-card);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            color: white;
        }

        .message.assistant .message-avatar {
            background: var(--bg-secondary);
            color: var(--accent-purple);
            border: 2px solid var(--accent-purple);
        }

        .message-content {
            background: var(--bg-secondary);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            line-height: 1.6;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            color: white;
            border: none;
        }

        .message-time {
            font-size: 0.75em;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .chat-input-container {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-card);
        }

        .chat-input-form {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 1em;
            resize: none;
            max-height: 120px;
        }

        .chat-input:focus {
            outline: none;
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 3px var(--shadow-glow);
        }

        .chat-send-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px var(--shadow-glow);
        }

        .chat-send-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 30px var(--shadow-glow);
        }

        .chat-send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: none;
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            max-width: 80px;
        }

        .typing-indicator.active {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.5;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state h3 {
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .suggestion-btn {
            padding: 8px 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s ease;
        }

        .suggestion-btn:hover {
            background: var(--bg-hover);
            border-color: var(--accent-purple);
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">MarketAI</div>
        <ul class="sidebar-nav">
            <li><a th:href="@{/dashboard}">Dashboard</a></li>
            <li><a th:href="@{/generator}">AI Generator</a></li>
            <li><a th:href="@{/chatbot}" class="active">Chatbot</a></li>
            <li><a th:href="@{/social}">Social Accounts</a></li>
            <li><a th:href="@{/logout}">Logout</a></li>
        </ul>
    </div>

    <div class="main-content">
        <header>
            <h1>Marketing Chatbot</h1>
            <p class="subtitle">Get AI-powered marketing advice, content ideas, and strategy suggestions</p>
        </header>

        <div class="card" style="padding: 0;">
            <div class="chat-container">
                <div class="chat-messages" id="chat-messages">
                    <div class="empty-state" id="empty-state">
                        <h3>👋 Welcome to your Marketing Assistant!</h3>
                        <p>Ask me anything about:</p>
                        <div class="suggestions">
                            <button class="suggestion-btn" type="button" onclick="sendSuggestion('Give me content ideas for Instagram')">Content Ideas</button>
                            <button class="suggestion-btn" type="button" onclick="sendSuggestion('Help me write a better caption')">Caption Rewrite</button>
                            <button class="suggestion-btn" type="button" onclick="sendSuggestion('Create ad copy for my product')">Ad Copy</button>
                            <button class="suggestion-btn" type="button" onclick="sendSuggestion('Marketing strategy advice')">Strategy Advice</button>
                        </div>
                    </div>
                </div>

                <div class="typing-indicator" id="typing-indicator">
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                    <div class="typing-dot"></div>
                </div>

                <div class="chat-input-container">
                    <form class="chat-input-form" id="chat-form">
                        <textarea
                            class="chat-input"
                            id="chat-input"
                            placeholder="Ask me about marketing, content, campaigns..."
                            rows="1"
                            onkeydown="handleKeyDown(event)"
                        ></textarea>
                        <button type="submit" class="chat-send-btn" id="send-btn">Send</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script th:src="@{/chatbot.js}"></script>
</body>
</html>
