<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MarketAI Suite</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <div class="container" style="max-width: 500px; margin-top: 100px;">
        <header>
            <div class="header-content">
                <h1>MarketAI Suite</h1>
                <p class="subtitle">AI-Powered Sales & Marketing Platform</p>
            </div>
        </header>

        <div class="card">
            <h2>Login</h2>
            <p class="description">Sign in to access your dashboard</p>

            <div th:if="${flashMessage != null}">
                <div class="error"
                     th:style="${flashType == 'success'} ? 'background: rgba(34, 197, 94, 0.1); color: #86efac; border-color: #22c55e;' : 'background: rgba(239, 68, 68, 0.1); color: #fca5a5; border-color: #ef4444;'">
                    <span th:text="${flashMessage}">Message</span>
                </div>
            </div>

            <form method="POST" th:action="@{/login}">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-primary">Login</button>
            </form>

            <p style="text-align: center; margin-top: 20px; color: var(--text-secondary);">
                Don't have an account?
                <a th:href="@{/register}" style="color: var(--accent-purple); text-decoration: none; font-weight: 600;">Register here</a>
            </p>
        </div>
    </div>
</body>
</html>
